<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>paper-hub · 合规开放论文</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; --bg:#f5f7fb; --card:#fff; --ink:#172033; --muted:#64748b; --accent:#2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg:#101827; --card:#172235; --ink:#e5e7eb; --muted:#9ca3af; } }
    body { margin:0; background:var(--bg); color:var(--ink); } main { max-width:1000px; margin:auto; padding:2rem 1rem; }
    h1 { margin:.2rem 0; } .lede { color:var(--muted); } form, article { background:var(--card); border-radius:12px; padding:1rem; box-shadow:0 2px 12px #0001; }
    form { display:grid; gap:.8rem; } .filters { display:flex; flex-wrap:wrap; gap:.7rem; align-items:center; } label { display:flex; gap:.3rem; align-items:center; }
    input[type=search], input[type=number] { border:1px solid #94a3b8; border-radius:6px; padding:.55rem; background:transparent; color:inherit; } input[type=search] { width:min(100%,34rem); }
    button, .button { border:0; border-radius:6px; padding:.55rem .8rem; background:var(--accent); color:white; cursor:pointer; text-decoration:none; } button.secondary { background:#64748b; }
    #status { margin:1rem 0; color:var(--muted); } #results { display:grid; gap:1rem; } article h2 { font-size:1.1rem; margin:.1rem 0 .5rem; } .meta { color:var(--muted); font-size:.9rem; }
    .badges { display:flex; flex-wrap:wrap; gap:.35rem; margin:.5rem 0; } .badge { border-radius:999px; background:#dbeafe; color:#1e40af; padding:.15rem .5rem; font-size:.8rem; }
    .actions { display:flex; gap:.5rem; flex-wrap:wrap; } .empty { text-align:center; padding:2rem; color:var(--muted); }
  </style>
</head>
<body><main>
  <h1>paper-hub</h1><p class="lede">六源合规开放论文搜索 · 来源 + DOI 可追溯</p>
  <nav class="actions"><button id="show-favorites" type="button" class="secondary">我的收藏</button><button id="show-downloads" type="button" class="secondary">已下载</button></nav>
  <form id="search-form">
    <label>关键词 <input id="keywords" name="keywords" type="search" required maxlength="300" placeholder="例如 nutrition"></label>
    <div class="filters"><span>来源</span>
      <label><input type="checkbox" name="source" value="europe_pmc" checked> Europe PMC</label>
      <label><input type="checkbox" name="source" value="doaj" checked> DOAJ</label>
      <label><input type="checkbox" name="source" value="arxiv" checked> arXiv</label>
      <label><input type="checkbox" name="source" value="openalex" checked> OpenAlex</label>
      <label><input type="checkbox" name="source" value="crossref" checked> Crossref</label>
      <label><input type="checkbox" name="source" value="pubmed" checked> PubMed</label>
    </div>
    <div class="filters"><label>年份从 <input id="year-from" type="number" min="1000" max="3000"></label><label>到 <input id="year-to" type="number" min="1000" max="3000"></label><label><input id="only-oa" type="checkbox"> 仅开放获取</label><button type="submit">搜索</button><button id="refresh" type="button" class="secondary">刷新</button></div>
  </form>
  <p id="status" role="status" aria-live="polite">输入关键词开始搜索。</p><section id="results" aria-live="polite"></section>
  <script>
    const form = document.querySelector('#search-form'), status = document.querySelector('#status'), results = document.querySelector('#results');
    const el = (tag, text, className) => { const node = document.createElement(tag); if (className) node.className = className; node.textContent = text; return node; };
    function render(items) { results.replaceChildren(); if (!items.length) { results.append(el('p', '没有找到符合条件的论文。', 'empty')); return; } items.forEach(item => {
      const card = el('article'); card.append(el('h2', item.title || 'Untitled')); const badges = el('div', '', 'badges');
      badges.append(el('span', item.primary_badge || item.source, 'badge')); (item.secondary_badges || []).forEach(source => badges.append(el('span', source, 'badge'))); card.append(badges);
      const meta = el('p', `${item.publication_year || '年份未知'} · ${item.doi ? 'DOI: ' + item.doi : '暂无 DOI'}`, 'meta'); card.append(meta);
      if (item.match_fields && item.matched_terms) card.append(el('p', `命中：${item.match_fields.join('、')} · ${item.matched_terms.join('、')}`, 'meta'));
      const actions = el('div', '', 'actions'); const detail = el('a', '查看摘要', 'button secondary'); detail.href = '/papers/' + encodeURIComponent(item.canonical_key); actions.append(detail);
      if (item.doi) { const doi = el('a', 'DOI 链接', 'button secondary'); doi.href = 'https://doi.org/' + encodeURIComponent(item.doi); doi.target = '_blank'; doi.rel = 'noopener noreferrer'; actions.append(doi); }
      const favorite = el('button', '收藏'); favorite.type = 'button'; favorite.addEventListener('click', async () => { const enabled = favorite.dataset.enabled !== 'true'; const response = await fetch('/api/papers/' + encodeURIComponent(item.canonical_key) + '/favorite', { method: enabled ? 'POST' : 'DELETE' }); if (response.ok) { favorite.dataset.enabled = String(enabled); favorite.textContent = enabled ? '取消收藏' : '收藏'; } }); actions.append(favorite);
      const download = el('a', '下载', 'button'); download.href = '/api/papers/' + encodeURIComponent(item.canonical_key) + '/download'; actions.append(download); card.append(actions); results.append(card);
    }); }
    async function showLibrary(kind, label) { status.textContent = `正在读取${label}…`; try { const response = await fetch('/api/' + kind); const payload = await response.json(); status.textContent = `${label} ${payload.results.length} 篇`; render(payload.results); } catch (_) { status.textContent = `读取${label}失败。`; } }
    document.querySelector('#show-favorites').addEventListener('click', () => showLibrary('favorites', '收藏'));
    document.querySelector('#show-downloads').addEventListener('click', () => showLibrary('downloads', '已下载'));
    async function submitSearch(force = false) { const query = new URLSearchParams({ keywords: document.querySelector('#keywords').value.trim(), only_oa: document.querySelector('#only-oa').checked, refresh: force });
      document.querySelectorAll('input[name=source]:checked').forEach(input => query.append('sources', input.value)); const from = document.querySelector('#year-from').value, to = document.querySelector('#year-to').value; if (from) query.set('year_from', from); if (to) query.set('year_to', to);
      status.textContent = '正在搜索…'; results.replaceChildren(); try { const response = await fetch('/api/search?' + query); if (!response.ok) throw new Error('search failed'); const payload = await response.json(); if (payload.error) throw new Error(payload.error); status.textContent = `找到 ${payload.count} 篇论文 · 意图：${payload.query_intent || payload.query}`; render(payload.results); } catch (error) { status.textContent = '搜索失败，请稍后重试。'; results.replaceChildren(el('p', error.message, 'empty')); }
    }
    form.addEventListener('submit', event => { event.preventDefault(); submitSearch(); }); document.querySelector('#refresh').addEventListener('click', () => submitSearch(true));
  </script>
</main></body></html>
