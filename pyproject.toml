[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperhub"
version = "0.1.0"
description = "合规开放论文下载站: 六源搜索 · 来源+DOI · OA 下载 · 收藏"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paperhub"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]